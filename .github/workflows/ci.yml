name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "cursor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Static build
        run: npm run build

      - name: Confirm the editor and drafts stayed out of dist
        run: npm run check:static

      - name: Demo editor and sample preview
        run: npm run build:demo

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Phone browser tests
        run: npm run test:e2e

  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/editor/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps webkit chromium

      - name: Phone and desktop browser tests
        run: npm run test:e2e

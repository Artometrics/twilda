name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "cursor/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # The dist-headers test builds the marketing site too, so its dependencies must be present.
      - name: Install marketing site
        run: npm ci --prefix www

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit, hostile content, headers and built output)
        run: npm test

      - name: Static build
        run: npm run build

      - name: Confirm the editor and drafts stayed out of dist
        run: npm run check:static

      - name: Form settings (starters and demo content)
        run: |
          npm run check:forms
          npm run check:forms examples/starter-corporate/content
          npm run check:forms examples/starter-leadgen/content
          npm run check:forms examples/starter-magazine/content

      - name: Demo editor and sample preview
        run: npm run build:demo

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Phone browser tests
        run: npm run test:e2e

      - name: Click-to-edit prototype (390px and desktop)
        run: npm run test:e2e:edit

      - name: Starters at 320, 390, and 1280 px under the production policy
        run: npm run test:e2e:starters

  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/editor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/editor/package-lock.json

      - name: Install workspace
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps webkit chromium

      - name: Phone and desktop browser tests
        run: npm run test:e2e

      - name: Desk under the production Content-Security-Policy
        run: npm run test:e2e:csp

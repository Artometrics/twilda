name: Security

# Checks that look at what a pull request adds: content and public files, secrets, and dependencies.
# Nothing here deploys, and nothing here has a secret. It runs with a read-only token.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # New advisories appear without any code change, so look weekly too.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content, public files, and secrets in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts: a pull request must not get to run an install script in this job.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Content, settings, and public files
        run: npm run check:content

      - name: Credential-shaped strings and key files
        run: npm run check:secrets

      - name: Hostile-content suite
        run: npx tsx --test tests/security/*.test.ts

  gitleaks:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release asset is pinned by version and checked against a SHA-256 kept in this file,
      # so a replaced release asset fails the job instead of running.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Findings are redacted in the log. Reviewed false positives live in .gitleaksignore.
      - name: Scan the full history
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # High and critical advisories fail the job unless security/audit-allowlist.json lists them with a reason
      # and a review date. See docs/security.md.
      - name: npm audit against the reviewed allowlist (root, www, desk)
        run: npm run check:audit

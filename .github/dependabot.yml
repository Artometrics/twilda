version: 2

# Version and advisory updates arrive as pull requests, and CI (including the security workflow's
# audit policy) runs on each one. Nothing here merges anything. Majors are left to a person:
# astro 7 and zod 4 change the public API, see docs/security.md "Accepted advisories".
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # Types follow the lowest Node the packages support (engines >=22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
